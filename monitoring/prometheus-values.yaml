prometheus:
  prometheusSpec:
    # מבטל את ההגבלה ומאפשר לפרומתאוס לחפש יעדים בכל הקלסטר
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}
    ruleNamespaceSelector: {}

alertmanager:
  config:
    global:
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'yahaligottlieb@gmail.com'
      smtp_auth_username: 'yahaligottlieb@gmail.com'
      smtp_auth_identity: 'yahaligottlieb@gmail.com'
      smtp_require_tls: true
    route:
      receiver: 'blackhole' # <-- ברירת המחדל החדשה: לא עושה כלום
      group_by: ['alertname', 'namespace']
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
      routes:
      - match:
          namespace: 'devops-app'
        receiver: 'email-notifications' # <-- רק ההתרעות שלך ינותבו לכאן
    receivers:
    - name: 'blackhole' # <-- רסיבר ריק ששואב את רעשי הרקע
    - name: 'email-notifications'
      email_configs:
      - to: 'yahaligottlieb@gmail.com'
        send_resolved: true